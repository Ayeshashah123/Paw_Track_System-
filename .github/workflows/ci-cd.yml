name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ closed ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: urbanaseem/paw_track_system:version4_backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: urbanaseem/paw_track_system:version4_frontend

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull urbanaseem/paw_track_system:version4_backend
            docker pull urbanaseem/paw_track_system:version4_frontend
            docker stop paw-backend paw-frontend || true
            docker rm paw-backend paw-frontend || true
            docker run -d --name paw-backend -p 5000:5000 urbanaseem/paw_track_system:version4_backend
            docker run -d --name paw-frontend -p 80:80 urbanaseem/paw_track_system:version4_frontend