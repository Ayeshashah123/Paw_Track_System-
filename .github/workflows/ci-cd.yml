name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build-and-push:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build & Push Backend Image
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_backend ./Backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_backend

      # Step 2: Build & Push Frontend Image
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_frontend ./Frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            # Pull latest images
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_backend
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_frontend
            
            # Stop existing containers if running
            docker stop paw-backend paw-frontend || true
            docker rm paw-backend paw-frontend || true
            
            # Run updated containers
            docker run -d --name paw-backend -p 5000:5000 ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_backend
            docker run -d --name paw-frontend -p 80:80 ${{ secrets.DOCKER_HUB_USERNAME }}/paw_track_system:version2_frontend