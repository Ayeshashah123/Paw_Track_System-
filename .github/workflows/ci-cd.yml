
name: PawTrack CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t pawtrack-backend:latest ./Backend

      - name: Build Frontend Image
        run: docker build -t pawtrack-frontend:latest ./Frontend

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Backend Image
        if: github.event_name == 'push'
        run: docker tag pawtrack-backend:latest ${{ secrets.DOCKER_USERNAME }}/pawtrack-backend:latest

      - name: Tag Frontend Image
        if: github.event_name == 'push'
        run: docker tag pawtrack-frontend:latest ${{ secrets.DOCKER_USERNAME }}/pawtrack-frontend:latest

      - name: Push Backend Image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pawtrack-backend:latest

      - name: Push Frontend Image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pawtrack-frontend:latest
